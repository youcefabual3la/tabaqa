<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 160" width="100%" height="100%">
  <!-- TABAQA MEDIA AGENCY — EXACT BRAND LOGO -->
  
  <!-- === MARK / ICON GROUP === -->
  <!-- Dark navy large left triangle (pointing right, angled) -->
  <polygon points="52,12 82,12 58,52" fill="#2e3f72"/>
  <!-- Dark navy large left body polygon -->
  <polygon points="30,30 58,5 80,42 52,78 28,68" fill="#263468"/>
  <!-- Dark navy right main polygon -->
  <polygon points="75,8 118,15 130,55 95,65 72,42" fill="#2e4078"/>
  <!-- Top small triangle peak -->
  <polygon points="80,5 100,5 90,22" fill="#3a4d8a"/>

  <!-- Cyan translucent overlay — left/center diamond -->
  <polygon points="22,60 60,28 118,50 88,88" fill="#42b0d5" opacity="0.72"/>
  <polygon points="22,60 60,28 118,50 88,88" fill="none" stroke="#1d2e55" stroke-width="1.5" opacity="0.85"/>

  <!-- Cyan translucent overlay — right wing -->
  <polygon points="75,35 128,22 145,65 102,72" fill="#35a8d0" opacity="0.68"/>
  <polygon points="75,35 128,22 145,65 102,72" fill="none" stroke="#1d2e55" stroke-width="1.5" opacity="0.85"/>

  <!-- Contour accent line -->
  <polygon points="35,55 90,12 148,68" fill="none" stroke="#1a2845" stroke-width="1.4" opacity="0.75"/>

  <!-- === TYPOGRAPHY === -->
  <text x="140" y="120" font-family="'Arial Black','Arial', 'Inter', sans-serif" font-weight="900" font-size="24" letter-spacing="2.5" fill="#0d0d0d" text-anchor="middle">TABAQA</text>
  <text x="140" y="140" font-family="'Arial', 'Inter', sans-serif" font-weight="500" font-size="8" letter-spacing="5" fill="#555555" text-anchor="middle">MEDIA AGENCY</text>
</svg>
