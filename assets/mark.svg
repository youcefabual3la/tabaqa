<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" width="100%" height="100%">
  <!-- TABAQA MEDIA AGENCY — BRAND ICON MARK ONLY -->
  <g transform="translate(120, 100) scale(0.95)">
    <!-- 1. Top Inverted Triangle -->
    <polygon points="0,-75 36,-75 18,-35" fill="#2b4374"/>
    
    <!-- 2. Left Dark Navy Polygon -->
    <polygon points="-65,-25 -30,-85 10,-15 -30,55" fill="#243b67"/>

    <!-- 3. Center-Right Dark Navy Polygon -->
    <polygon points="12,-80 60,-15 85,30 32,50 8,-15" fill="#2d477a"/>

    <!-- 4. Translucent Cyan Overlay Polygon 1 (Left/Center) -->
    <polygon points="-90,40 -30,-35 75,20 30,85" fill="#3fa9d2" opacity="0.75" style="mix-blend-mode: multiply;"/>
    <polygon points="-90,40 -30,-35 75,20 30,85" stroke="#1a2c4e" stroke-width="2.2" fill="none" opacity="0.9"/>

    <!-- 5. Translucent Cyan Overlay Polygon 2 (Right Wing) -->
    <polygon points="8,-20 80,-65 125,20 58,40" fill="#38a6d0" opacity="0.7" style="mix-blend-mode: multiply;"/>
    <polygon points="8,-20 80,-65 125,20 58,40" stroke="#1a2c4e" stroke-width="2.2" fill="none" opacity="0.9"/>

    <!-- 6. Sharp Contour Contour Lines -->
    <polygon points="-55,15 35,-70 105,35" stroke="#182845" stroke-width="1.8" fill="none" opacity="0.85"/>
  </g>
</svg>
